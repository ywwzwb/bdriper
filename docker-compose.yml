services:
  bdriper:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      - /mnt/bdmv:/input:ro
      - /mnt/output:/output
    devices:
      - /dev/dri:/dev/dri
    environment:
      - MAX_CONCURRENT=2
    restart: unless-stopped

